spring.application.name=resource

server.port=9000

logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# ? Resource-Server erwartet JWT-Token von UAA
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://uaa:8080/oauth/token
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://uaa:8080/token_keys

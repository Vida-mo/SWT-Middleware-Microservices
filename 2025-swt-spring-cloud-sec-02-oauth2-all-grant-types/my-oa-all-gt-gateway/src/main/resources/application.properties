spring.application.name=gateway

server.port=8080

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG

# ? Allgemeine Gateway Konfiguration: Alle Flows
spring.security.oauth2.client.registration.gateway.provider=uaa
spring.security.oauth2.client.registration.gateway.client-id=gateway
spring.security.oauth2.client.registration.gateway.client-secret=secret

## ? Konfiguration: Client Credentials Flow
#spring.security.oauth2.client.registration.gateway.authorization-grant-type=client_credentials
#spring.security.oauth2.client.registration.gateway.scope=resource.read,uaa.user

